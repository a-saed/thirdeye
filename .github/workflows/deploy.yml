# Push to main -> tested, built, deployed.
#
# NO SERVICE-ACCOUNT KEY. Authentication is Workload Identity Federation: the
# GitHub OIDC token is exchanged for a short-lived Google credential, and the
# provider is bound to this repository only. A leaked long-lived JSON key is
# the usual way a demo project becomes someone else's crypto miner.
#
# THE DATA IS NOT IN THIS REPO. data/ is gitignored — the tables are derived
# and carry source licences that should not be redistributed here — but the
# image bakes them in, because a Cloud Run instance is the image and nothing
# else. So the build pulls them from GCS. A monthly pipeline run therefore
# means: upload the new tables, then re-run this workflow.

name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:        # a redeploy after a data refresh needs no commit

env:
  PROJECT_ID: thirdeye-demo-260906
  REGION: us-central1
  SERVICE: thirdeye
  IMAGE: us-central1-docker.pkg.dev/thirdeye-demo-260906/thirdeye/api
  DATA_BUCKET: gs://thirdeye-demo-260906-data

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # required to mint the OIDC token

    steps:
      - uses: actions/checkout@v4

      # Tests gate the deploy. A red build must never reach the demo — and
      # api/spa_test.go is what keeps unknown paths returning 404 rather than
      # quietly going back to 200.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: api/go.sum
      - name: Go tests
        working-directory: api
        run: go test ./... && go vet ./...

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Typecheck
        working-directory: web
        run: npm ci && npx tsc --noEmit

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/466032735471/locations/global/workloadIdentityPools/github/providers/github-provider
          service_account: github-deployer@thirdeye-demo-260906.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      # EVERY DERIVED INPUT IS GITIGNORED, AND THERE ARE TWO SETS OF THEM.
      # The parquet tables the API loads, and three files the SPA fetches at
      # runtime — the coverage GeoJSON and two small JSON files. Both sets are
      # correctly excluded from git (derived, licence-bearing) and both must be
      # present at build time. Missing the second set shipped a live map with
      # "coverage layer: HTTP 404" while every deployment check still passed.
      - name: Fetch the derived tables
        run: |
          mkdir -p data/derived
          gcloud storage cp -r "$DATA_BUCKET/h3_tables" data/derived/
          ls -la data/derived/h3_tables

      - name: Fetch the derived web assets
        run: |
          gcloud storage cp "$DATA_BUCKET/web-public/*" web/public/
          # Fail loudly here rather than serving a map with no data on it.
          for f in coverage-res8.geojson coverage-summary.json regions.json; do
            test -s "web/public/$f" || { echo "missing web/public/$f"; exit 1; }
          done
          ls -la web/public/coverage-res8.geojson

      # After the fetch, because the coverage GeoJSON is one of its inputs.
      # Also runs the MapLibre style validator, so an invalid paint expression
      # fails here rather than rendering a blank map in production.
      - name: Build the SPA
        working-directory: web
        run: npm run build

      # BUILT ON THE RUNNER, NOT ON CLOUD BUILD.
      # `gcloud builds submit` needs read AND write on a staging bucket it
      # creates in the project, plus serviceusage.services.use. Three attempts
      # with progressively broader grants (serviceUsageConsumer,
      # storage.objectAdmin, then bucket-scoped storage.admin) all failed the
      # same way, and the error names a permission the account demonstrably
      # had. Building here removes the staging bucket, the extra roles and the
      # whole failure mode; the cost is ~2 minutes of runner time and a 28 MB
      # push. Fewer moving parts beats a faster build we cannot debug.
      - name: Authenticate Docker to Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push the image
        run: |
          docker build -t "$IMAGE:${GITHUB_SHA::12}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${GITHUB_SHA::12}"
          docker push "$IMAGE:latest"

      - name: Deploy
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE:${GITHUB_SHA::12}" \
            --region "$REGION" \
            --memory 1Gi --cpu 1 \
            --min-instances 0 --max-instances 3 \
            --allow-unauthenticated \
            --timeout 30s

      # Deploying is not the same as working. These are the checks from
      # docs/DEPLOYMENT.md, run against the revision that just went live.
      - name: Verify the deployment
        run: |
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)')
          echo "Deployed: $URL"
          fail=0
          check() {
            got=$(curl -s -o /dev/null -w '%{http_code}' "$URL$1")
            if [ "$got" != "$2" ]; then
              echo "FAIL $1 -> $got (want $2)"; fail=1
            else
              echo "ok   $1 -> $got"
            fi
          }
          check /                        200
          check /api/healthz             200
          check /nope                    404   # the SPA fallback must not report success
          check /assets/missing.js       404
          # The map is the product. These three are gitignored derived files
          # fetched from GCS at build time; when they are absent the app still
          # renders, still returns 200 everywhere, and shows an empty map with
          # "coverage layer: HTTP 404". Checking only routes let that ship.
          check /coverage-res8.geojson   200
          check /coverage-summary.json   200
          check /regions.json            200
          exit $fail
