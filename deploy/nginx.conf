# nginx for a VPS deployment.
#
# THREE THINGS THIS FILE EXISTS TO GET RIGHT:
#  1. /report and /compare are served BY THE API, because it injects the meta
#     tags that make a shared link preview correctly. They are not static.
#  2. Everything else is static, including the 4.6 MB coverage GeoJSON.
#  3. An unknown path returns a real 404 STATUS, not 200 with the SPA. A
#     product that says what it does not have must not report success for a
#     page that does not exist.

upstream thirdeye_api { server 127.0.0.1:8080; }

server {
  listen 443 ssl http2;
  server_name example.invalid;   # replace with the real domain

  ssl_certificate     /etc/letsencrypt/live/example.invalid/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/example.invalid/privkey.pem;

  root /srv/thirdeye/web;
  gzip on;
  gzip_types application/json application/geo+json text/css application/javascript image/svg+xml;
  gzip_min_length 1024;

  # JSON API
  location /api/ {
    proxy_pass http://thirdeye_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 30s;
  }

  # Server-rendered HTML for share previews. Exact matches only.
  location = /report  { proxy_pass http://thirdeye_api; }
  location = /compare { proxy_pass http://thirdeye_api; }

  # Immutable hashed assets
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # The coverage layer changes with each pipeline run
  location = /coverage-res8.geojson { expires 1h; }

  # Client-side routes that are genuinely pages
  location = /        { try_files /index.html =404; }
  location = /tokens  { try_files /index.html =404; }

  # ANYTHING ELSE IS A 404, WITH A 404 STATUS. The SPA still renders the
  # not-found page, but the status line tells the truth.
  location / { try_files $uri @notfound; }
  location @notfound { return 404; }
  error_page 404 /index.html;
  location = /index.html { internal; }
}

server {
  listen 80;
  server_name example.invalid;
  return 301 https://$host$request_uri;
}
